# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

# TODO:
# - cache this directory $HOME/.cache/pyensembl/
# - update coveralls
# - get a badge for tests passing
# - download binary dependencies from conda
name: Tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
        polars-version: ["latest"]
        include:
          - python-version: "3.11"
            polars-version: "1.31.0"
          - python-version: "3.11"
            polars-version: "1.32.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-cov coveralls
          pip install -r requirements.txt
          pip install .
      - name: Install compatibility Polars version
        if: matrix.polars-version != 'latest'
        run: python -m pip install 'polars==${{ matrix.polars-version }}'
      - name: Run default linting script
        run: |
          ./lint.sh
      - name: Run unit tests
        run: |
          ./test.sh -W error::DeprecationWarning
      - name: Publish coverage to Coveralls
        if: matrix.python-version == '3.11' && matrix.polars-version == 'latest'
        uses: coverallsapp/github-action@v2.2.3
