# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Tests
on: [push, pull_request]

env:
  # Reruns share run_id; each attempt needs its own parallel coverage report.
  COVERALLS_SERVICE_NUMBER: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  packaging:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: "3.9"
            setuptools: "setuptools==77.0.3"
          - python-version: "3.11"
            setuptools: "setuptools"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine wheel ruff pytest pytest-cov '${{ matrix.setuptools }}' -r requirements.txt
      - name: Build and validate distributions
        run: |
          python -m build --no-isolation
          python -m twine check --strict dist/*
      - name: Run lint and tests from the source distribution
        run: |
          archive_dir=$(mktemp -d)
          tar -xzf dist/gtfparse-*.tar.gz -C "$archive_dir"
          cd "$archive_dir"/gtfparse-*
          ./lint.sh
          ./test.sh -W error::DeprecationWarning

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - python-version: "3.9"
            pandas-version: "minimum"
            pyarrow-version: "minimum"
            polars-version: "none"
          - python-version: "3.10"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "none"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "none"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "minimum"
            polars-version: "none"
          - python-version: "3.11"
            pandas-version: "2.3.3"
            pyarrow-version: "latest"
            polars-version: "none"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "minimum"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "1.31.0"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "1.32.0"
          - python-version: "3.11"
            pandas-version: "latest"
            pyarrow-version: "latest"
            polars-version: "latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest pytest-cov coveralls
          pip install -r requirements.txt
          pip install .
      - name: Install compatibility dependency versions
        env:
          PANDAS_VERSION: ${{ matrix.pandas-version }}
          PYARROW_VERSION: ${{ matrix.pyarrow-version }}
          POLARS_VERSION: ${{ matrix.polars-version }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from importlib.metadata import requires
          from packaging.requirements import Requirement

          requirements = [Requirement(text) for text in requires("gtfparse")]
          pins = []
          for name in ("pandas", "pyarrow", "polars"):
              version = os.environ[f"{name.upper()}_VERSION"]
              if version == "none":
                  continue
              if version == "minimum":
                  requirement = next(r for r in requirements if r.name == name)
                  version = next(s.version for s in requirement.specifier if s.operator == ">=")
              pins.append(name if version == "latest" else f"{name}=={version}")
          subprocess.run([sys.executable, "-m", "pip", "install", *pins], check=True)
          PY
      - name: Verify base installation has no Polars
        if: matrix.polars-version == 'none'
        run: python -c "from importlib.util import find_spec; assert find_spec('polars') is None"
      - name: Check installed dependency requirements
        run: python -m pip check
      - name: Run default linting script
        run: |
          ./lint.sh
      - name: Run unit tests
        run: |
          ./test.sh -W error::DeprecationWarning
      - name: Publish coverage to Coveralls
        if: matrix.python-version == '3.11'
        uses: coverallsapp/github-action@v2.2.3
        with:
          flag-name: pandas-${{ matrix.pandas-version }}-arrow-${{ matrix.pyarrow-version }}-polars-${{ matrix.polars-version }}
          parallel: true

  coverage:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Finish combined coverage report
        uses: coverallsapp/github-action@v2.2.3
        with:
          parallel-finished: true
